name: Build

# Compila l'app per l'orologio (pacchetto .zab) con lo strumento ufficiale di Zepp (zeus).
# Su ogni push il pacchetto si scarica dagli Artifacts della run. Avviato a mano (Actions → Build → Run workflow)
# con "release" acceso, pubblica una Release con il numero di versione di app.json (es. v0.1.0) e il .zab allegato.
on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una Release con la versione di app.json"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  zab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dipendenze del progetto
        run: npm install --no-audit --no-fund
      - name: Strumento di Zepp (zeus)
        # zeus porta con sé il modulo "zeppos-app-utils" in private-modules/: si usa quello, con le sue dipendenze,
        # e mai il pacchetto omonimo su npm, che non è di Zepp
        run: |
          mkdir -p "$RUNNER_TEMP/zeus" && cd "$RUNNER_TEMP/zeus"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund @zeppos/zeus-cli@1.9.3
          P=node_modules/@zeppos/zeus-cli/private-modules/zeppos-app-utils
          DEPS=$(node -e "const d=require('./$P/package.json').dependencies||{};console.log(Object.entries(d).map(([k,v])=>k+'@'+v).join(' '))")
          npm install --no-audit --no-fund --no-save $DEPS
          rm -rf node_modules/zeppos-app-utils && cp -r "$P" node_modules/zeppos-app-utils
          echo "$RUNNER_TEMP/zeus/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Compila
        run: |
          zeus --version
          zeus build
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-Dial-zab
          path: dist/*.zab
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./app.json').app.version.name")"
          gh release create "$V" dist/*.zab --target "$GITHUB_SHA" --title "Iris Dial $V" --notes-file docs/installazione.md --prerelease || \
          gh release upload "$V" dist/*.zab --clobber
