name: Pages

# Publishes the website (site/) to GitHub Pages, with the interactive prototype and the eyes engine
# taken straight from the repo, so the page always matches main.
on:
  push:
    branches: [main]
    paths: ["site/**", "design/**", "shared/occhi-web.js", "docs/images/**", "tools/bundle_demo.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          python3 tools/bundle_demo.py
          mkdir -p _site/images
          cp -r site/. _site/
          cp design/prototype.html _site/demo.html
          cp shared/occhi-web.js _site/eyes.js
          cp docs/images/* _site/images/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
